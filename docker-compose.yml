services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: sayedahammed.com,www.sayedahammed.com,web
      DJANGO_CSRF_TRUSTED_ORIGINS: https://sayedahammed.com,https://www.sayedahammed.com
      DJANGO_DATABASE_PATH: /data/db.sqlite3
      DJANGO_STATIC_ROOT: /app/staticfiles
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      MCP_SERVER_URL: http://mcp-tools:8001/mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - portfolio_db:/data
      - portfolio_static:/app/staticfiles
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/', headers={'Host':'sayedahammed.com','X-Forwarded-Proto':'https'}); urllib.request.urlopen(req).read(1)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      mcp-tools:
        condition: service_healthy

  mcp-tools:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "portfolio.mcp_server"]
    restart: unless-stopped
    environment:
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; connection = socket.create_connection(('127.0.0.1', 8001), 2); connection.close()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    build:
      context: ./deploy/nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - portfolio_static:/app/staticfiles:ro
      - portfolio_letsencrypt:/etc/letsencrypt:ro
      - portfolio_challenges:/var/www/certbot:ro

  certbot:
    image: certbot/certbot@sha256:3be63cf59c4db843369369424fcbd66653fd612eaaa951948fdeb44b2988ac39
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?Set CERTBOT_EMAIL in .env}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        cert_dir=/etc/letsencrypt/live/sayedahammed.com
        if [ ! -s "$$cert_dir/fullchain.pem" ] || [ ! -s "$$cert_dir/privkey.pem" ]; then
          certbot certonly --webroot -w /var/www/certbot \
            --email "$$CERTBOT_EMAIL" --agree-tos --no-eff-email --non-interactive \
            -d sayedahammed.com -d www.sayedahammed.com
        fi
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet
          sleep 12h & wait "$$!"
        done
    volumes:
      - portfolio_letsencrypt:/etc/letsencrypt
      - portfolio_challenges:/var/www/certbot

volumes:
  portfolio_db:
  portfolio_static:
  portfolio_letsencrypt:
  portfolio_challenges:
