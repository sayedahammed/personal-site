{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#F7FAFC">
  <meta name="description" content="The portfolio of Md. Sayed Ahammed, Senior Software Engineer building enterprise platforms, telecom products, and useful automation.">
